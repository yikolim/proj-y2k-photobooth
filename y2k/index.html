<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2b8ee8" />
    <meta name="description" content="Y2K Photobooth is a private, playful browser photobooth with live filters and social-ready templates." />
    <title>Y2K Photobooth</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./y2k.css?v=202611010027" />
  </head>
  <body>
    <div class="sky" aria-hidden="true">
      <i class="bubble b1"></i><i class="bubble b2"></i><i class="bubble b3"></i><i class="bubble b4"></i><i class="bubble b5"></i><i class="bubble b6"></i><i class="bubble b7"></i><i class="bubble b8"></i>
      <i class="spark s1"></i><i class="spark s2"></i><i class="spark s3"></i><i class="spark s4"></i><i class="spark s5" style="left:3%;top:40%"></i><i class="spark s6" style="right:3%;bottom:14%"></i><i class="spark s7" style="left:12%;bottom:6%"></i>
    </div>

    <main class="window">
      <div class="glints" aria-hidden="true">
        <i style="--x:1%;--y:-1%;--s:58px;--d:0s"></i>
        <i style="--x:99%;--y:0.5%;--s:44px;--d:1.1s"></i>
        <i style="--x:3%;--y:6.5%;--s:37px;--d:2.3s"></i>
        <i style="--x:84%;--y:1.2%;--s:31px;--d:.6s"></i>
        <i style="--x:1.5%;--y:22%;--s:51px;--d:1.7s"></i>
        <i style="--x:100%;--y:21%;--s:48px;--d:.3s"></i>
        <i style="--x:56%;--y:10.5%;--s:34px;--d:2.9s"></i>
        <i style="--x:34%;--y:14%;--s:27px;--d:1.4s"></i>
        <i style="--x:100%;--y:46%;--s:41px;--d:2s"></i>
        <i style="--x:0;--y:45%;--s:34px;--d:.9s"></i>
        <i style="--x:100%;--y:67%;--s:51px;--d:1.3s"></i>
        <i style="--x:5%;--y:74%;--s:54px;--d:2.6s"></i>
        <i style="--x:60%;--y:73.5%;--s:31px;--d:.4s"></i>
        <i style="--x:98%;--y:77%;--s:37px;--d:1.9s"></i>
        <i style="--x:25%;--y:71%;--s:27px;--d:3.2s"></i>
        <i style="--x:2%;--y:98%;--s:44px;--d:.8s"></i>
        <i style="--x:95%;--y:99%;--s:51px;--d:2.2s"></i>
        <i style="--x:70%;--y:89%;--s:27px;--d:1.6s"></i>
      </div>
      <header class="titlebar">
        <span class="winlogo" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
        <h1>Y2K PHOTOBOOTH.exe</h1>
        <span class="scenery" aria-hidden="true"><i class="tree"></i></span>
        <span class="win-controls" aria-hidden="true"><i class="min"></i><i class="max"></i><i class="close"></i></span>
      </header>

      <nav class="tabs" aria-label="Sections">
        <button class="tab" id="navCamera" aria-pressed="true">
          <svg class="tab-icon" viewBox="0 0 48 48" aria-hidden="true">
            <defs>
              <radialGradient id="camBall" cx="38%" cy="32%" r="65%"><stop offset="0" stop-color="#ffffff"/><stop offset=".35" stop-color="#8fd0ff"/><stop offset=".75" stop-color="#1f74d6"/><stop offset="1" stop-color="#0b3f8a"/></radialGradient>
              <radialGradient id="camLens" cx="40%" cy="35%" r="60%"><stop offset="0" stop-color="#ffffff"/><stop offset=".3" stop-color="#5fb4ff"/><stop offset=".7" stop-color="#0b3f8a"/><stop offset="1" stop-color="#021a40"/></radialGradient>
              <linearGradient id="camBase" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eef6ff"/><stop offset="1" stop-color="#9ec4ec"/></linearGradient>
            </defs>
            <ellipse cx="24" cy="42" rx="14" ry="4" fill="url(#camBase)" stroke="#6f9ed0" stroke-width=".8"/>
            <rect x="21" y="32" width="6" height="9" rx="2" fill="url(#camBase)" stroke="#6f9ed0" stroke-width=".8"/>
            <circle cx="24" cy="20" r="15" fill="url(#camBall)"/>
            <circle cx="24" cy="20" r="8.5" fill="url(#camLens)"/>
            <circle cx="21" cy="16.5" r="2.4" fill="#fff" opacity=".9"/>
            <ellipse cx="18" cy="11" rx="6" ry="3" fill="#fff" opacity=".55" transform="rotate(-30 18 11)"/>
          </svg>
          <span>Camera</span>
        </button>
        <button class="tab" id="navEffects" aria-pressed="false">
          <svg class="tab-icon" viewBox="0 0 48 48" aria-hidden="true">
            <defs><linearGradient id="fxA" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3e4ff"/><stop offset=".5" stop-color="#c28bff"/><stop offset="1" stop-color="#8a3df0"/></linearGradient></defs>
            <path d="M20 4 L23.5 16.5 L36 20 L23.5 23.5 L20 36 L16.5 23.5 L4 20 L16.5 16.5 Z" fill="url(#fxA)" stroke="#fff" stroke-width="1.2" stroke-linejoin="round"/>
            <path d="M36 26 L38 32 L44 34 L38 36 L36 42 L34 36 L28 34 L34 32 Z" fill="url(#fxA)" stroke="#fff" stroke-width="1" stroke-linejoin="round"/>
            <path d="M38 6 L39.2 9.8 L43 11 L39.2 12.2 L38 16 L36.8 12.2 L33 11 L36.8 9.8 Z" fill="url(#fxA)" stroke="#fff" stroke-width=".8" stroke-linejoin="round"/>
          </svg>
          <span>Effects</span>
        </button>
        <button class="tab" id="navTemplates" aria-pressed="false">
          <svg class="tab-icon" viewBox="0 0 48 48" aria-hidden="true">
            <defs>
              <linearGradient id="bgSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5fb6ff"/><stop offset="1" stop-color="#cfeeff"/></linearGradient>
              <linearGradient id="bgHill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9ae04a"/><stop offset="1" stop-color="#2f9a1c"/></linearGradient>
            </defs>
            <rect x="4" y="8" width="40" height="32" rx="4" fill="#fff" stroke="#9cc5ee" stroke-width="1.2"/>
            <rect x="7" y="11" width="34" height="26" rx="2" fill="url(#bgSky)"/>
            <circle cx="33" cy="18" r="3.5" fill="#fff6a8"/>
            <path d="M7 37 C 12 26, 18 25, 24 31 C 29 26, 35 27, 41 33 L41 37 Z" fill="url(#bgHill)"/>
            <ellipse cx="14" cy="17" rx="5" ry="2.4" fill="#fff" opacity=".9"/>
          </svg>
          <span>Backgrounds</span>
        </button>
        <button class="tab" id="navGallery" aria-pressed="false">
          <svg class="tab-icon" viewBox="0 0 48 48" aria-hidden="true">
            <defs><linearGradient id="galSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6cc0ff"/><stop offset="1" stop-color="#e0f4ff"/></linearGradient></defs>
            <g transform="rotate(-12 24 24)"><rect x="8" y="12" width="30" height="24" rx="2" fill="#fff" stroke="#9cc5ee"/><rect x="11" y="15" width="24" height="18" fill="#ffd36e"/></g>
            <g transform="rotate(6 24 24)"><rect x="10" y="10" width="30" height="24" rx="2" fill="#fff" stroke="#9cc5ee"/><rect x="13" y="13" width="24" height="18" fill="url(#galSky)"/><path d="M13 31 C 18 22, 22 23, 25 27 C 28 23, 33 24, 37 29 L37 31 Z" fill="#4db031"/><circle cx="31" cy="18" r="2.4" fill="#fff5a0"/></g>
          </svg>
          <span>Gallery</span>
        </button>
        <button class="tab" id="navShare" aria-pressed="false">
          <svg class="tab-icon" viewBox="0 0 48 48" aria-hidden="true">
            <defs>
              <radialGradient id="shHead" cx="35%" cy="30%" r="70%"><stop offset="0" stop-color="#fff"/><stop offset=".4" stop-color="#7fc4ff"/><stop offset="1" stop-color="#1b63c4"/></radialGradient>
              <linearGradient id="shBody" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9ad4ff"/><stop offset="1" stop-color="#1e6fd0"/></linearGradient>
              <linearGradient id="shArrow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b8ff6a"/><stop offset="1" stop-color="#2f9a1c"/></linearGradient>
            </defs>
            <circle cx="20" cy="14" r="9" fill="url(#shHead)"/>
            <path d="M4 42 C 4 29, 12 25, 20 25 C 28 25, 36 29, 36 42 Z" fill="url(#shBody)"/>
            <path d="M30 34 C 32 27, 37 25, 44 25 L 44 20 L 48 27 L 44 34 L 44 29 C 38 29, 34 30, 30 34 Z" fill="url(#shArrow)" stroke="#fff" stroke-width="1" stroke-linejoin="round"/>
          </svg>
          <span>Share</span>
        </button>
      </nav>

      <section class="stage">
        <div class="preview-panel">
          <div class="statusline">
            <svg class="cam-mini" viewBox="0 0 48 48" aria-hidden="true"><ellipse cx="24" cy="42" rx="14" ry="4" fill="#cfe6ff" stroke="#6f9ed0" stroke-width=".8"/><rect x="21" y="32" width="6" height="9" rx="2" fill="#cfe6ff" stroke="#6f9ed0" stroke-width=".8"/><circle cx="24" cy="20" r="15" fill="url(#camBall)"/><circle cx="24" cy="20" r="8.5" fill="url(#camLens)"/><circle cx="21" cy="16.5" r="2.4" fill="#fff" opacity=".9"/></svg>
            <span class="status-dot" aria-hidden="true"></span>
            <span id="statusText">CAMERA READY</span>
          </div>
          <div class="canvas-wrap" id="canvasWrap">
            <video id="camera" autoplay playsinline muted></video>
            <canvas id="preview" aria-label="Camera preview"></canvas>
            <div class="camera-empty" id="cameraEmpty">
              <p>Start your camera or choose a photo.</p>
              <div class="empty-actions">
                <button class="glass-button" id="startCamera">Start camera</button>
                <button class="glass-button upload-trigger">Upload photo</button>
              </div>
            </div>
            <div class="countdown" id="countdown" aria-live="assertive"></div>
          </div>
        </div>

        <aside class="faces">
          <div class="shots" id="shots">
            <div class="face-panel">
              <div class="face-head"><span class="person-ico" aria-hidden="true"></span>Face 1<span class="caret" aria-hidden="true"></span></div>
              <button class="shot empty" data-index="0" aria-label="Empty photo 1"><span>1</span></button>
              <span class="caret foot" aria-hidden="true"></span>
            </div>
            <div class="face-panel">
              <div class="face-head"><span class="person-ico" aria-hidden="true"></span>Face 2<span class="caret" aria-hidden="true"></span></div>
              <button class="shot empty" data-index="1" aria-label="Empty photo 2"><span>2</span></button>
              <span class="caret foot" aria-hidden="true"></span>
            </div>
            <div class="face-panel">
              <div class="face-head"><span class="person-ico" aria-hidden="true"></span>Face 3<span class="caret" aria-hidden="true"></span></div>
              <button class="shot empty" data-index="2" aria-label="Empty photo 3"><span>3</span></button>
              <span class="caret foot" aria-hidden="true"></span>
            </div>
            <div class="face-panel">
              <div class="face-head"><span class="person-ico" aria-hidden="true"></span>Face 4<span class="caret" aria-hidden="true"></span></div>
              <button class="shot empty" data-index="3" aria-label="Empty photo 4"><span>4</span></button>
              <span class="caret foot" aria-hidden="true"></span>
            </div>
          </div>
        </aside>
      </section>

      <section class="actions">
        <button class="glass-button big" id="retakeButton">
          <svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 0 1 13.6-5.7L20 8.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/><path d="M20 4v5h-5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M20 12a8 8 0 0 1-13.6 5.7L4 15.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/><path d="M4 20v-5h5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>Retake</span>
        </button>
        <button class="glass-button big shutter" id="shutter"><span>Take Photo</span></button>
        <button class="glass-button big" id="exportButton">
          <svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V4" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/><path d="M7.5 8.5 12 4l4.5 4.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 14v4.5A1.5 1.5 0 0 0 5.5 20h13a1.5 1.5 0 0 0 1.5-1.5V14" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>
          <span>Export</span>
        </button>
      </section>

      <section class="control-panel" aria-label="Templates">
        <button class="strip-arrow prev" id="stripPrev" data-dir="-1" aria-label="Scroll left"></button>
        <div class="control-group" id="templateGroup">
          <div class="artwork-gallery" id="artworkGallery"></div>
        </div>
        <button class="strip-arrow next" id="stripNext" data-dir="1" aria-label="Scroll right"></button>
        <div class="scroll-pill" aria-hidden="true"></div>
      </section>

      <!-- Controls the booth script needs that this skin keeps out of sight. -->
      <div class="offstage" hidden>
        <button id="panelOpen" aria-expanded="false"></button>
        <button id="resetAll">Reset</button>
        <span id="frameCounter"></span><span id="templateLabel"></span><span id="shotCount"></span>
        <input id="uploadPhoto" type="file" accept="image/*" />
        <div id="cameraGroup">
          <button id="flipCamera">Flip camera</button>
          <div id="filterList">
            <button class="active" data-filter="clean">Clean</button><button data-filter="glow">Glow</button><button data-filter="dusk">Dusk</button><button data-filter="mono">Mono</button><button data-filter="citrus">Citrus</button>
          </div>
        </div>
        <div id="templateGrid">
          <button data-template="portrait">Portrait</button><button data-template="story">Story</button><button data-template="square">Square</button><button data-template="fourcut">4 Cut</button>
        </div>
        <div id="photoAdjustment">
          <input id="photoZoom" type="range" min="1" max="3" step="0.01" value="1" />
          <input id="photoX" type="range" min="-1" max="1" step="0.01" value="0" />
          <input id="photoY" type="range" min="-1" max="1" step="0.01" value="0" />
          <button id="clearSlot">Retake</button><button id="resetFit">Reset position</button>
        </div>
        <div id="extraList">
          <button class="active" data-extra="none">None</button><button data-extra="sparkles">Sparkles</button><button data-extra="hearts">Hearts</button><button data-extra="stamp">Date stamp</button>
        </div>
        <button id="downloadButton" disabled>Save</button>
        <button id="shareButton" hidden disabled>Share</button>
        <p id="saveNote"></p>
      </div>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="../shared/templates.js?v=202611010027"></script>
    <script src="../shared/app.js?v=202611010027"></script>
    <script>
      // This skin opens on the Sole Mates template and treats the Camera tab as
      // the camera switch; Effects, Gallery and Share are tabs in the frame only.
      const feet = document.querySelector('#artworkGallery [data-template="feet"]');
      feet?.click();
      if (feet) document.querySelector('#templateGroup').scrollLeft = feet.offsetLeft - feet.offsetWidth - 14;
      const tabs = document.querySelectorAll('.tabs .tab');
      tabs.forEach(tab => tab.addEventListener('click', () => {
        tabs.forEach(other => other.setAttribute('aria-pressed', String(other === tab)));
        if (tab.id === 'navCamera') document.querySelector('#startCamera').click();
      }));
    </script>
  </body>
</html>
